name: Build Executables

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'gui/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r gui/requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        cd gui
        pyinstaller build_spec.spec

    - name: Upload artifacts (Ubuntu)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v3
      with:
        name: INCAR_Generator_Linux
        path: gui/dist/INCAR_Generator

    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v3
      with:
        name: INCAR_Generator_Windows
        path: gui/dist/INCAR_Generator.exe

    - name: Upload artifacts (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v3
      with:
        name: INCAR_Generator_macOS
        path: gui/dist/INCAR_Generator.app

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: gui/dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
